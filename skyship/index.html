<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- STYLE: Living watercolor storybook sky, light and golden (Eric's own Sky Ship logo as the hero mark, painted clouds that part by hand, IM Fell English italic in olive ink, no dark UI) | WHY: Eric founded Sky Ship Studios in Madison in 2014; Gordon wants its watercolor galleon to fly again, framed as thanks for what closing the studio made possible | ALT: A 3D low-poly model spin of the ship, rejected because it would trade his painted logo for a generic render -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sky Ship</title>
<meta name="description" content="The Sky Ship sails again, for Eric, with thanks from Gordon.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Alegreya+Sans:wght@500;700&display=swap">
<style>
:root{--ink:#3d3a1f;--olive:#6f7a2a;--sail:#7fb6dc;--lav:#a99ad0;--gold:#f6c86a;--paper:#fbf4e6;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#f3e6cf;color:var(--ink);font:15px/1.45 "Alegreya Sans",system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
body{background:radial-gradient(120% 80% at 50% 20%,#fdf3dd,#e9d6b6 70%,#d8c3a3)}
.stage{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(100vw,calc(100svh*9/16));overflow:hidden;background:#f7e2bd;box-shadow:0 0 60px #7a5a2a33}
.sky{position:absolute;inset:-12%;transition:transform 1.1s cubic-bezier(.3,1.5,.5,1)}
.sky video,.sky img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shown .sky{transform:translateY(-6%);transition:transform 3s ease-in-out}
.sky.bank{transform:rotate(-5deg) translate(-3%,-2%) scale(1.04)}
/* cloud curtain */
.cloud{position:absolute;top:-6%;bottom:-6%;width:62%;background:url(media/clouds.jpg) center/cover;transition:transform 2.4s cubic-bezier(.6,0,.2,1),opacity 2.4s;z-index:4}
.cloud.l{left:-6%;background-position:20% 50%;-webkit-mask:linear-gradient(90deg,#000 70%,transparent);mask:linear-gradient(90deg,#000 70%,transparent)}
.cloud.r{right:-6%;background-position:80% 50%;-webkit-mask:linear-gradient(270deg,#000 70%,transparent);mask:linear-gradient(270deg,#000 70%,transparent)}
.open .cloud.l{transform:translateX(-95%) scale(1.25);opacity:.0}
.open .cloud.r{transform:translateX(95%) scale(1.25);opacity:.0}
.invite{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:0 24px;border:0;background:none;color:var(--ink);font:inherit;cursor:pointer;transition:opacity 1s}
.invite small{font-weight:700;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--olive)}
.invite b{font:italic 400 clamp(30px,9vw,42px)/1.1 "IM Fell English",Georgia,serif}
.invite span{font-size:14px;opacity:.85}
.invite i{width:62px;height:62px;border-radius:50%;margin-top:8px;background:radial-gradient(circle,#fff 0 30%,#fff8 31% 60%,transparent 61%);box-shadow:0 0 34px #fff,0 0 70px var(--gold);animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.14);box-shadow:0 0 44px #fff,0 0 100px var(--gold)}}
.open .invite{opacity:0;pointer-events:none}
/* reveal */
.reveal{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:0 22px calc(env(safe-area-inset-bottom,0px) + 14px);text-align:center;pointer-events:none}
.reveal::before{content:"";position:absolute;inset:-14% -10% 0;background:radial-gradient(80% 62% at 50% 64%,#fffaf0f2 0 45%,#fffaf0aa 66%,transparent 84%);-webkit-mask:linear-gradient(transparent,#000 26%);mask:linear-gradient(transparent,#000 26%);z-index:-1;opacity:0;transition:opacity 1.6s}
.logo{display:block;width:min(62%,280px);margin:0 auto 2px;opacity:0;transform:translateY(18px) scale(.94);transition:opacity 1.8s,transform 2.2s cubic-bezier(.2,1.2,.4,1);filter:drop-shadow(0 0 10px #fffaf0) drop-shadow(0 0 3px #fff);pointer-events:auto;cursor:pointer}
.logo.bank{animation:bank 1.1s cubic-bezier(.3,1.4,.5,1)}
@keyframes bank{35%{transform:rotate(-7deg) translate(-4%,-6%)}70%{transform:rotate(3deg) translate(2%,-2%)}}
.meta{margin:2px 0 10px;font-weight:700;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--olive);opacity:0;transition:opacity 1.4s .6s}
.line{margin:0 auto;max-width:31ch;font:italic 400 clamp(16px,4.6vw,20px)/1.34 "IM Fell English",Georgia,serif;color:var(--ink)}
.line span{opacity:0;transition:opacity .9s}
.line span.on{opacity:1}
.foot{margin:8px 0 0;font-size:11.5px;opacity:0;transition:opacity 1.2s;color:#5a5233}
.again{pointer-events:auto;margin:8px auto 0;display:inline-block;border:1.5px solid #6f7a2a88;background:#fffaf0cc;color:var(--ink);font:700 12px/1 "Alegreya Sans",sans-serif;letter-spacing:.2em;text-transform:uppercase;padding:12px 18px;min-height:44px;border-radius:22px;cursor:pointer;opacity:0;transition:opacity 1s}
.shown .reveal::before,.shown .logo,.shown .meta,.shown .foot,.shown .again{opacity:1}
.shown .logo{transform:none}
.hint{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:0;right:0;z-index:3;text-align:center;font-size:12px;letter-spacing:.14em;color:#fff;text-shadow:0 1px 8px #7a5a2a;opacity:0;transition:opacity 1s;pointer-events:none}
.flying .hint{opacity:.9}
.spark{position:absolute;z-index:6;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,#fff,var(--c) 45%,transparent 70%);animation:spark 1.3s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.mute{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);right:8px;z-index:7;width:44px;height:44px;border-radius:50%;border:0;background:#fffaf0aa;color:var(--ink);font-size:18px;cursor:pointer;display:none}
.open .mute{display:block}
/* JS off: show everything still */
.nojs .cloud,.nojs .invite,.nojs .mute{display:none}
.nojs .reveal::before,.nojs .logo,.nojs .meta,.nojs .foot{opacity:1;transform:none}
.nojs .line span{opacity:1}
.nojs .again{display:none}
@media (prefers-reduced-motion:reduce){.sky,.cloud,.logo{transition-duration:.01s}.invite i{animation:none}.sky.bank,.logo.bank{transform:none;animation:none}}
</style>
</head>
<body class="nojs">
<main class="stage" id="stage">
  <div class="sky" id="sky">
    <video id="vid" src="media/skyship.mp4" poster="media/poster.jpg" playsinline muted preload="auto" controls aria-label="Eric's watercolor sky ship rising out of golden clouds and sailing into the sun"></video>
  </div>
  <div class="cloud l" aria-hidden="true"></div>
  <div class="cloud r" aria-hidden="true"></div>
  <button class="invite" id="go" type="button" aria-label="Part the clouds, sound on">
    <small>For Eric, from Gordon</small>
    <b>Something is up there</b>
    <span>Sound on, then tap to part the clouds</span>
    <i aria-hidden="true"></i>
  </button>
  <p class="hint" id="hint">tap the sky to catch the wind</p>
  <button class="mute" id="mute" type="button" aria-label="Mute sound">&#9834;</button>
  <section class="reveal" aria-live="polite">
    <img class="logo" id="logo" src="media/skyship-mark.png" alt="The Sky Ship Studios logo: a watercolor sky galleon with blue sails and a green hill hull, above the words SkyShip Studios">
    <p class="meta">Madison &middot; 2014</p>
    <p class="line" id="line"><span>You built a ship and sailed it with your crew.</span> <span>Closing it took its own kind of courage,</span> <span>and so much of what you build now sails on that wind.</span> <span>Thank you, Captain.</span></p>
    <button class="again" id="again" type="button">Sail again</button><a class="again" href="../" onclick="if(history.length>1&&document.referrer){history.back();return false;}" style="margin-left:10px;text-decoration:none;display:inline-block">Back to Stoughton</a>
    <p class="foot">made by Darby, Gordon's AI assistant, with love from Gordon</p>
  </section>
</main>
<script>
(function(){
  var b=document.body,st=document.getElementById('stage'),sky=document.getElementById('sky'),v=document.getElementById('vid'),logo=document.getElementById('logo'),spans=[].slice.call(document.querySelectorAll('#line span'));
  b.classList.remove('nojs');v.removeAttribute('controls');
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var AC=window.AudioContext||window.webkitAudioContext,ctx=null,bufs={},master=null,muted=false,musicSrc=null,windSrc=null,timers=[];
  var names=['music','wind','whoosh','chime','bank'];
  function load(){
    if(!AC)return;
    ctx=new AC();master=ctx.createGain();master.connect(ctx.destination);
    names.forEach(function(n){
      fetch('media/'+n+'.mp3').then(function(r){return r.arrayBuffer()}).then(function(a){
        return new Promise(function(res,rej){ctx.decodeAudioData(a,res,rej)})
      }).then(function(d){bufs[n]=d;if(n==='music'&&st.classList.contains('open')&&!musicSrc)startBed()}).catch(function(){});
    });
  }
  function play(n,vol,loop,fade){
    if(!ctx||!bufs[n])return null;
    var s=ctx.createBufferSource(),g=ctx.createGain();s.buffer=bufs[n];s.loop=!!loop;
    var t=ctx.currentTime;
    if(fade){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+fade)}else g.gain.value=vol;
    s.connect(g);g.connect(master);s.start();s._g=g;return s;
  }
  function startBed(){musicSrc=play('music',.8,false,2.5);windSrc=play('wind',.45,true,1.5)}
  function stopBed(){[musicSrc,windSrc].forEach(function(s){if(s){try{s._g.gain.setTargetAtTime(0.0001,ctx.currentTime,.4);s.stop(ctx.currentTime+2)}catch(e){}}});musicSrc=windSrc=null}
  function later(f,ms){timers.push(setTimeout(f,ms))}
  function reveal(){
    if(st.classList.contains('shown'))return;
    st.classList.add('shown');st.classList.remove('flying');
    play('chime',.75);
    spans.forEach(function(s,i){later(function(){s.classList.add('on')},1400+i*1500)});
  }
  function sail(){
    timers.forEach(clearTimeout);timers=[];
    st.classList.remove('shown');spans.forEach(function(s){s.classList.remove('on')});
    st.classList.add('open','flying');
    try{v.currentTime=0}catch(e){}
    var p=v.play();if(p&&p.catch)p.catch(function(){});
    play('whoosh',.9);stopBed();startBed();
    later(reveal,reduce?600:7600);
  }
  document.getElementById('go').addEventListener('click',function(){
    if(!ctx)load();else if(ctx.state==='suspended')ctx.resume();
    sail();
  });
  document.getElementById('again').addEventListener('click',function(e){e.stopPropagation();sail()});
  v.addEventListener('ended',reveal);
  document.getElementById('mute').addEventListener('click',function(e){
    e.stopPropagation();muted=!muted;if(master)master.gain.value=muted?0:1;
    this.innerHTML=muted?'&#215;':'&#9834;';this.setAttribute('aria-label',muted?'Unmute sound':'Mute sound');
  });
  var cols=['#7fb6dc','#a99ad0','#f6c86a','#ffffff','#9fbf5a'];
  function sparkle(x,y){
    var r=st.getBoundingClientRect();
    for(var i=0;i<16;i++){
      var d=document.createElement('i');d.className='spark';
      var a=Math.PI*(.75+Math.random()*.5),len=60+Math.random()*120;
      d.style.left=(x-r.left)+'px';d.style.top=(y-r.top)+'px';
      d.style.setProperty('--c',cols[i%cols.length]);
      d.style.setProperty('--dx',(Math.cos(a)*len)+'px');d.style.setProperty('--dy',(Math.sin(a)*len*.5+20)+'px');
      d.style.animationDelay=(i*25)+'ms';
      st.appendChild(d);setTimeout(function(n){return function(){n.remove()}}(d),1700);
    }
  }
  function bank(el,x,y){
    if(!reduce){el.classList.remove('bank');void el.offsetWidth;el.classList.add('bank');setTimeout(function(){el.classList.remove('bank')},1150)}
    sparkle(x,y);play('bank',.85);
  }
  st.addEventListener('click',function(e){
    if(!st.classList.contains('open')||e.target.closest('button'))return;
    if(e.target===logo)bank(logo,e.clientX,e.clientY);else bank(sky,e.clientX,e.clientY);
  });
})();
</script>
</body>
</html>
